name: Sync trading-cex subtree

on:
  repository_dispatch:
    types:
      - trading-cex-updated
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trading-cex-subtree-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Open subtree sync PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exchange-lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch trading-cex main
        run: |
          git remote add trading-cex https://github.com/nogie-dev/trading-cex.git
          git fetch --no-tags trading-cex main

      - name: Create subtree sync branch
        id: sync
        env:
          BRANCH: chore/sync-trading-cex-${{ github.run_id }}
        run: |
          base_sha=$(git rev-parse origin/main)
          git switch --create "$BRANCH" origin/main
          git subtree pull --prefix=services/trading-cex trading-cex main --squash
          if [ "$(git rev-parse HEAD)" = "$base_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Chore: sync trading-cex subtree" \
            --body "Automated subtree sync from nogie-dev/trading-cex main."
